capture_snapshot:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector

add_sample:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    filename:
      required: true
      example: "20260811_131029.jpg"
      selector:
        text:
    bin:
      required: true
      example: "gelbe_tonne"
      selector:
        text:
    rect:
      required: true
      example: "[0.52, 0.61, 0.06, 0.05]"
      selector:
        object:
    space:
      required: false
      default: image
      selector:
        select:
          translation_key: space
          options:
            - image
            - roi

label_image:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    filename:
      required: true
      example: "20260811_131029.jpg"
      selector:
        text:
    present:
      required: false
      example: "[gelbe_tonne, blaue_tonne]"
      selector:
        object:
    absent:
      required: false
      example: "[braune_tonne]"
      selector:
        object:
    auto_relearn:
      required: false
      default: true
      selector:
        boolean:

relearn:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector

forget_image:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    filename:
      required: true
      example: "20260811_131029.jpg"
      selector:
        text:

restore_image:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    filename:
      required: true
      example: "20260811_131029.jpg"
      selector:
        text:

reconfirm_images:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    filenames:
      required: true
      example: "[20260811_131029.jpg, 20260811_140102.jpg]"
      selector:
        object:

mark_bin_appearance_changed:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    bin:
      required: true
      example: "gelbe_tonne"
      selector:
        text:

set_roi:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: wastebin_ai_detector
    roi_x:
      required: true
      example: 0.24
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    roi_y:
      required: true
      example: 0.10
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    roi_w:
      required: true
      example: 0.42
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    roi_h:
      required: true
      example: 0.86
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    working_width:
      required: false
      example: 640
      selector:
        number:
          min: 1
          step: 1
          mode: box

discard_auto_evidence:
  name: Automatisch gesammeltes zuruecknehmen
  description: >-
    Nimmt alle automatisch gesammelten Farbproben aus dem Training. Es
    wird nichts geloescht; restore_auto_evidence macht es rueckgaengig.
  fields:
    entry_id:
      name: Eintrag
      required: false
      selector:
        text:

restore_auto_evidence:
  name: Automatisch gesammeltes wieder zulassen
  description: >-
    Laesst zuvor zurueckgenommene Proben wieder ins Training und hebt
    eine Pause der automatischen Sammlung auf.
  fields:
    entry_id:
      name: Eintrag
      required: false
      selector:
        text:

start_learning:
  name: Lernlauf starten
  description: >-
    Erklaert die aktuelle Situation und startet den selbstaendigen
    Lernlauf. Ab dann nimmt das System in festem Abstand eigene
    Aufnahmen und wertet sie als genau diese Situation. Die Tonnen
    duerfen sich waehrend des Laufs nicht veraendern.
  fields:
    present:
      name: Tonnen, die da sind
      required: false
      selector:
        object:
    absent:
      name: Tonnen, die weg sind
      required: false
      selector:
        object:
    entry_id:
      name: Eintrag
      required: false
      selector:
        text:

stop_learning:
  name: Lernlauf beenden
  description: Beendet den Lernlauf und loescht die Situations-Erklaerung.
  fields:
    entry_id:
      name: Eintrag
      required: false
      selector:
        text:
